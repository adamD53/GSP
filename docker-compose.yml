services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${KAFKA_EXTERNAL_PORT:-19092}
      - --smp
      - "1"
      - --memory
      - 512M
      - --mode
      - dev-container
      - --default-log-level=warn
    ports:
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  api:
    build: .
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      DEFAULT_TOPIC: ${DEFAULT_TOPIC:-raw-logs}
      PARSED_TOPIC: ${PARSED_TOPIC:-parsed-logs}
      DEAD_LETTER_TOPIC: ${DEAD_LETTER_TOPIC:-dead-letter-logs}
      RULES_FILE: /app/rules.json
      RUNBOOKS_FILE: /app/runbooks.json
      ALERTS_DB_PATH: /app/data/alerts.db
    volumes:
      - ./rules.json:/app/rules.json
      - ./runbooks.json:/app/runbooks.json
      - alerts_data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    depends_on:
      redpanda:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:9092}
      DEFAULT_TOPIC: ${DEFAULT_TOPIC:-raw-logs}
      PARSED_TOPIC: ${PARSED_TOPIC:-parsed-logs}
      DEAD_LETTER_TOPIC: ${DEAD_LETTER_TOPIC:-dead-letter-logs}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID:-ollama-log-parser}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-16}
      ENABLE_FAST_PARSER: ${ENABLE_FAST_PARSER:-true}
      ENABLE_SCHEMA_LEARNING: ${ENABLE_SCHEMA_LEARNING:-true}
      RULES_FILE: /app/rules.json
      RUNBOOKS_FILE: /app/runbooks.json
      ALERTS_DB_PATH: /app/data/alerts.db
    volumes:
      - ./rules.json:/app/rules.json
      - ./runbooks.json:/app/runbooks.json
      - alerts_data:/app/data

  ui:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "${UI_PORT:-3000}:3000"

volumes:
  ollama_data:
  alerts_data:
